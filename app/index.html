<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>searchFlow</title>
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="searchFlow">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#34445e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--navy:#34445e;--blue:#3d567c;--copper:#8a5a44;--ink:#2b2f36;--sub:#5f6773;--line:#e2e6ec;--bg:#f5f6f8;--surface:#fff;--error:#b3261e;--ok:#2e6b4f;--on:#fff}
@media (prefers-color-scheme:dark){:root{--blue:#8fb0dc;--copper:#d3a68e;--ink:#e8eaee;--sub:#a3abb7;--line:#343a44;--bg:#16191e;--surface:#20242b;--error:#f2a59f;--ok:#8fd0b0;--on:#16191e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 12px;display:flex;align-items:center;gap:8px;min-height:56px}
header h1{font-size:17px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:none;border:0;color:#fff;font:inherit;font-size:15px;padding:8px;margin:-8px 0;min-height:44px}
main{padding:12px 16px calc(env(safe-area-inset-bottom) + 96px);max-width:640px;margin:0 auto}
.pc{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub);padding:4px 0 12px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.dot.off{background:var(--error)}
.warn{background:var(--surface);border-left:3px solid var(--error);padding:10px 12px;border-radius:6px;font-size:14px;margin-bottom:12px}
h2{font-size:13px;font-weight:600;color:var(--sub);margin:20px 0 8px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.box+.box{margin-top:8px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 14px;color:inherit;font:inherit;min-height:60px}
.row:first-child{border-top:0}
.t{font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.s{font-size:14px;color:var(--sub);margin-top:2px;overflow-wrap:anywhere}
.s b{color:var(--copper);font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;margin:10px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
.step{padding:14px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0;padding-top:0}
.step:last-child{padding-bottom:0}
.btn{display:block;width:100%;min-height:48px;margin-top:10px;border:1.5px solid var(--blue);border-radius:10px;background:var(--blue);color:var(--on);font:600 16px/1.2 inherit;font-family:inherit;padding:10px}
.btn.sec{background:none;color:var(--blue)}
.btn:disabled{opacity:.5}
.two{display:flex;gap:8px}.two .btn{flex:1}
label{display:block;font-size:14px;color:var(--sub);margin-top:10px}
input,select{display:block;width:100%;height:48px;margin-top:4px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:16px inherit;font-family:inherit}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.c{padding:12px 0;border-top:1px solid var(--line)}
.c:first-child{border-top:0;padding-top:0}
.c a{color:var(--blue);font-size:14px;display:inline-block;padding:6px 0}
#toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);max-width:608px;margin:auto;background:var(--navy);color:#fff;border-radius:10px;padding:12px 14px;font-size:15px;z-index:9;display:none;box-shadow:0 8px 24px rgba(30,40,55,.25)}
#toast.err{background:#8c1d18}
.login{max-width:400px;margin:40px auto 0}
.err{color:var(--error);font-size:14px;margin-top:8px}
.empty{color:var(--sub);font-size:15px;padding:16px 14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.stat .ln{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub);min-height:28px}
.stat .ln b{color:var(--ink);font-weight:600}
.stat .ln .r{margin-left:auto;font-size:13px}
.dot.warn{background:#c98a1b}
.dot.live{animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,107,79,.55)}70%{box-shadow:0 0 0 8px rgba(46,107,79,0)}100%{box-shadow:0 0 0 0 rgba(46,107,79,0)}}
.bar.run i{background-image:linear-gradient(45deg,rgba(255,255,255,.35) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.35) 50%,rgba(255,255,255,.35) 75%,transparent 75%);background-size:16px 16px;animation:stripe 1s linear infinite;min-width:12%;transition:width .6s ease}
@keyframes stripe{from{background-position:0 0}to{background-position:16px 0}}
.live .big{font-size:26px;font-weight:700;color:var(--copper);font-variant-numeric:tabular-nums;line-height:1.2}
.live .big small{font-size:14px;color:var(--sub);font-weight:400;margin-left:6px}
.bump{animation:bump .9s ease}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.12)}100%{transform:scale(1)}}
.plus{color:var(--ok);font-weight:600;font-size:14px;margin-left:8px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:6px;margin:4px 0 12px}.tabs button{flex:1;min-height:40px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--sub);font:600 14px inherit;font-family:inherit}.tabs button.on{border-color:var(--blue);color:var(--blue)}
.kpi{font-size:15px;font-weight:700;color:var(--navy);margin-top:6px}.kpi small{font-weight:400;color:var(--sub);font-size:13px;margin-left:4px}
@media (prefers-color-scheme:dark){.kpi{color:var(--ink)}}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:4px;padding:0 5px;margin-right:4px;border:1px solid var(--line);color:var(--sub)}
.cols{display:flex;gap:12px}.cols>div{flex:1;min-width:0}
.mono{font-size:13px;color:var(--sub);background:var(--bg);border-radius:6px;padding:6px 8px;margin-top:8px;overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){.dot.live,.bar.run i,.bump,.spin{animation:none}}
</style>
</head>
<body>
<header><button id="back" hidden aria-label="뒤로">‹ 목록</button><h1 id="title">searchFlow</h1><button id="reload">새로고침</button></header>
<main id="main"></main>
<div id="toast" role="status"></div>
<script>
'use strict';
const SB = 'https://qxcrtwtjhllsbgahfqvd.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4Y3J0d3RqaGxsc2JnYWhmcXZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE0NjMxMDUsImV4cCI6MjA2NzAzOTEwNX0.0hd5bIoy1YXWdXM99MoeikrJkSYyAnsKnxLCBgG_5Ms';
const OFFLINE_MS = 12 * 60000;   // PC가 Cloudflare 중계를 쓰면 Supabase에는 10분마다 올림 (2026-11-13)
const $ = function(id) { return document.getElementById(id); };
const esc = function(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
const num = function(n) { return Number(n || 0).toLocaleString('ko-KR'); };

let skipped = new Set(), session = null, state = null, device = '', view = null, must = {}, sending = false, loadError = '';
try { session = JSON.parse(localStorage.getItem('sfApp') || 'null'); } catch (e) { session = null; }
function saveSession(s) {
  session = s ? { access_token: s.access_token, refresh_token: s.refresh_token, expires: Date.now() + (s.expires_in || 3600) * 1000, uid: s.user && s.user.id } : null;
  try { if (session) localStorage.setItem('sfApp', JSON.stringify(session)); else localStorage.removeItem('sfApp'); } catch (e) {}
}
async function auth(path, body) {
  const r = await fetch(SB + '/auth/v1/' + path, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await r.json().catch(function() { return {}; });
  if (!r.ok) throw new Error(r.status === 400 ? '메일 또는 비밀번호를 확인해 주세요' : '로그인 오류 ' + r.status);
  return d;
}
async function token() {
  if (Date.now() > session.expires - 60000) {
    try { saveSession(await auth('token?grant_type=refresh_token', { refresh_token: session.refresh_token })); }
    catch (e) { if (navigator.onLine) { saveSession(null); render(); } throw new Error('다시 로그인해 주세요'); }
  }
  return session.access_token;
}
async function rest(path, opts) {
  opts = opts || {};
  const r = await fetch(SB + '/rest/v1/' + path, { method: opts.method || 'GET',
    headers: Object.assign({ apikey: KEY, Authorization: 'Bearer ' + await token(), 'Content-Type': 'application/json' }, opts.headers || {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined });
  const text = await r.text();
  if (!r.ok) throw new Error('서버 오류 ' + r.status);
  return text ? JSON.parse(text) : null;
}

async function load() {
  if (!session) return;
  try {
    const rows = await rest('sf_app_state?select=device,data');
    // 작업 PC(윈도) 상태를 우선 — 맥북이 더 늦게 올렸어도 PC 기준으로 보여 줌 (2026-11-18)
    const sorted = (rows || []).sort(function(a, b) { return (b.data.at || 0) - (a.data.at || 0); });
    const best = sorted.find(function(r) { return r.data.os === 'win'; }) || sorted[0];
    state = best ? best.data : null; device = best ? best.device : ''; loadError = '';
    skipped = new Set((await rest('sf_board_seen?select=post&skipped=is.true') || []).map(function(x) { return x.post; }));
  } catch (e) { loadError = e.message; }
  if (!sending) render();
}
async function loadMust(id) {
  try {
    // 2026-11-13부터 후보자는 order:<id>:cand:0~15 묶음에 나뉘어 있음 (sync.js) — 기기별로 같은 사람이 있으면 하나만
    const rows = await rest('sf_sync?select=c:data->candidates&doc_key=like.' + encodeURIComponent('order:' + id + ':cand:*'));
    const by = new Map();
    (rows || []).forEach(function(r) { (r.c || []).forEach(function(c) {
      if (!(c.detail && c.detail.verdict === '필수')) return;
      const k = String(c.residx), had = by.get(k);
      if (!had || (c.offered && !had.offered)) by.set(k, c);   // 제안 완료 표시가 있는 쪽을 씀
    }); });
    must[id] = Array.from(by.values());
  } catch (e) { must[id] = null; }
  render();
}

function toast(text, err, keep) {
  const t = $('toast');
  t.textContent = text; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast.t);
  if (!keep) toast.t = setTimeout(function() { t.style.display = 'none'; }, 6000);
}
// 명령을 넣고 PC가 처리할 때까지 결과를 기다림
async function send(cmd, orderId, args) {
  if (sending) return;
  sending = true; render();
  try {
    toast('PC에 전달하는 중입니다. 30초 안에 처리됩니다.', false, true);
    const rows = await rest('sf_commands', { method: 'POST', headers: { Prefer: 'return=representation' },
      body: { user_id: session.uid, cmd: cmd, order_id: orderId || '', status: 'pending', args: Object.assign({ app: true }, args || {}) } });
    const id = rows[0].id;
    for (let i = 0; i < 75; i++) {
      await new Promise(function(r) { setTimeout(r, 4000); });
      const c = (await rest('sf_commands?select=status,result&id=eq.' + id))[0];
      if (c && (c.status === 'done' || c.status === 'failed')) { toast(c.result || '처리했습니다.', c.status === 'failed'); return; }
      if (c && c.status === 'taken') toast('PC에서 처리하는 중입니다.', false, true);
    }
    toast('PC 응답을 기다리는 중입니다. 잠시 뒤 새로고침해 주세요.', true);
  } catch (e) { toast(e.message, true); }
  finally { sending = false; await load(); }
}

function online() { return !!state && Date.now() - state.at < OFFLINE_MS; }
function ago(t) { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? '방금' : m < 60 ? m + '분 전' : m < 1440 ? Math.round(m / 60) + '시간 전' : Math.round(m / 1440) + '일 전'; }
// 사이트별 상태 (사람인 = 오더 그 자체, 잡코리아 = o.jk) — 2026-11-18 확장과 같은 기준으로
function srSite(o) { return { site: '', running: o.running, rounds: o.rounds, left: o.left, collected: o.collected, ranked: o.ranked, plan: o.plan, prog: o.prog, strat: o.strat }; }
function jkSite(o) { const j = o.jk; return j ? { site: 'jk', running: j.running, rounds: j.rounds, left: j.left, collected: j.collected, ranked: j.ranked, plan: true, prog: j.prog, strat: j.strat } : null; }
function roundsOf(x) { return x.strat ? x.strat : { done: x.rounds - x.left, total: x.rounds, left: x.left, seq: 0, collected: null }; }
// 명단 평가 상태 (새 PC 버전은 evalFull·evalFullJk, 예전 버전은 eval)
function evals() {
  const out = [];
  const fresh = function(e) { return e && (e.active || Date.now() - (e.doneAt || 0) < 6 * 3600000); };
  if (state.evalFull !== undefined || state.evalFullJk !== undefined) {
    [state.evalFull, state.evalFullJk].forEach(function(e) {
      if (!fresh(e)) return;
      out.push({ orderId: e.orderId, site: e.site || '', active: e.active, waiting: e.waiting, why: e.why, kind: e.kind, goal: e.goal,
        must: Math.max(e.liveMust || 0, e.lastMust || 0), first: e.evaluated || 0, detail: Math.max(e.liveDetail || 0, e.detailDone || 0), rate: e.rate });
    });
  } else if (state.eval) out.push(Object.assign({ site: '' }, state.eval));
  return out;
}
function evalOfOrder(id, site) { return evals().find(function(e) { return e.orderId === id && (e.site || '') === site; }) || null; }
function siteWord(site) { return site === 'jk' ? '잡코리아' : '사람인'; }

function siteState(o, x) {
  if (!x) return '';
  const e = evalOfOrder(o.id, x.site);
  if (x.running) return '수집 중 · 이 오더 ' + num(x.collected) + '명';
  if (e && e.active) return e.waiting ? '평가 멈춤 · 확인 필요' : '명단 평가 중';
  if (!x.plan) return '전략 전';
  const r = roundsOf(x);
  if (x.collected) return num(x.collected) + '명' + (r.left ? ' · 남은 라운드 ' + r.left : '');
  return '라운드 ' + r.left + '개 대기';
}
function stateLine(o) {
  const bits = [];
  if (o.ap) bits.push('자동운전 ' + o.ap);
  if (o.queued) bits.push('수집 차례 대기');
  if (o.night === 'wait') bits.push('밤 수집 대기');
  if (!o.analyzed) bits.push('분석 전');
  else {
    bits.push('사람인 ' + siteState(o, srSite(o)));
    if (o.jk) bits.push('잡코리아 ' + siteState(o, jkSite(o)));
  }
  return bits.join(' · ');
}
function btn(label, cmd, id, cls, extra) {
  return '<button class="btn ' + (cls || '') + '" data-cmd="' + cmd + '" data-id="' + esc(id || '') + '"' + (extra || '') + (sending || !online() ? ' disabled' : '') + '>' + esc(label) + '</button>';
}
// 명단 평가 상자 — 필수 발굴/목표 + 두 비율(① 1차 적극 · ② 정밀 필수)을 크게 (확장 진행 현황과 같은 기준)
function evalBox(e, o) {
  const pct = e.goal ? Math.min(100, Math.round(e.must / e.goal * 100)) : 0;
  const id = (e.site === 'jk' ? 'jk:' : '') + e.orderId;
  const r = e.rate;
  let h = (o ? '<div class="t"><span class="tag">' + siteWord(e.site) + '</span>' + esc(o.title) + '</div>' : '') + '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
    '<div class="s">필수 발굴 <b>' + e.must + '</b> / 목표 ' + e.goal + '명</div>';
  if (e.first && r && r.hiRate != null) h += '<div class="kpi">① 1차 적극 비율 ' + r.hiRate + '%<small>1차 ' + num(e.first) + '명 중 적극 ' + num(r.hi) + '명</small></div>';
  else if (e.first) h += '<div class="s">1차 ' + num(e.first) + '명</div>';
  if (r && r.detailed) h += '<div class="kpi">② 정밀 필수 비율 ' + r.rate + '%<small>정밀 ' + num(r.detailed) + '명 중 필수 ' + num(r.must) + '명</small></div>';
  else if (e.detail) h += '<div class="s">정밀 ' + num(e.detail) + '명</div>';
  if (e.kind === 'dry') h += '<div class="warn" style="margin:10px 0 0">연속으로 필수가 나오지 않아 멈췄습니다 — 서칭 전략을 점검할 신호입니다. 텔레그램 [📊 결과 분석 → 새 전략]으로 새 전략을 만들거나, 그대로 계속할 수 있습니다.</div>';
  else if (e.why) h += '<div class="s" style="margin-top:6px">' + esc(e.why) + '</div>';
  if (e.active && e.waiting) h += '<div class="two">' + btn('계속 진행', 'poolgo', id) + btn('여기서 종료', 'poolend', id, 'sec') + '</div>';
  else if (!e.active) h += '<div class="s">끝남</div>';
  return h;
}

// 연결·로그인 상태 줄 (PC 신호 · 사람인 · 잡코리아 · 하이웍스)
function secAgo(t) { const s = Math.max(0, Math.round((Date.now() - t) / 1000)); return s < 60 ? s + '초 전' : ago(t); }
function siteLine(name, x) {
  if (!x) return '<div class="ln"><span class="dot warn"></span>' + name + ' <b>확인 전</b><span class="r">20분마다 확인</span></div>';
  return '<div class="ln"><span class="dot' + (x.ok ? '' : ' off') + '"></span>' + name + ' <b>' + (x.ok ? '로그인됨' : '로그인 풀림') + '</b><span class="r" data-ago="' + x.at + '">' + ago(x.at) + ' 확인</span></div>';
}
function statusBox() {
  const on = online(), lg = state.login || {};
  let h = '<div class="stat"><div class="ln"><span class="dot' + (on ? ' live' : ' off') + '"></span>' + esc(device) + ' <b>' + (on ? '연결됨' : '응답 없음') + '</b><span class="r" data-sago="' + state.at + '">' + secAgo(state.at) + '</span></div>' +
    siteLine('사람인', lg.saramin) + ('jobkorea' in lg ? siteLine('잡코리아', lg.jobkorea) : '') + siteLine('하이웍스', lg.hiworks) + '</div>';
  if (state.waitLogin) h += '<div class="warn">🔒 사람인 로그인을 기다리는 중 — ' + esc(state.waitLogin.cmd) + (state.waitLogin.title ? ' · ' + esc(state.waitLogin.title) : '') +
    '<br>PC에서 로그인하면 3분 안에 자동으로 시작합니다.</div>';
  return h;
}
// 수집 진행 상자 (확장 전략 창과 같은 구성, 2026-11-18)
//  왼쪽 '이 전략 진행' = 이 전략 수집(회차 합산) · 진행 막대 · 라운드 현재/전체 · 남은 라운드 / 오른쪽 '이 오더 누적' = 수집 명단 인원 · 몇 번째 전략
let lastCount = {};
function liveBox(o, x, withTitle) {
  const p = x.prog || {};
  const r = roundsOf(x);
  const pct = r.total ? Math.round(r.done / r.total * 100) : 0;
  const key = o.id + x.site;
  const big = r.collected != null ? r.collected : x.collected;
  const prev = lastCount[key]; lastCount[key] = big;
  const bump = prev != null && big > prev;
  // PC는 진행 중일 때 2분마다 올림 → 신호가 PC 상태 시각보다 3분 넘게 앞서면 늦어짐
  const stale = p.beat && state.at - p.beat > 180000;
  const cur = Math.min(r.done + 1, r.total);
  return '<div class="live">' + (withTitle ? '<div class="t"><span class="tag">' + siteWord(x.site) + '</span>' + esc(o.title) + '</div>' : '') +
    '<div class="cols"><div><div class="s">이 전략 진행</div><div class="big' + (bump ? ' bump' : '') + '">' + num(big) + '<small>명 수집</small></div></div>' +
    '<div><div class="s">이 오더 누적</div><div class="t" style="margin-top:4px">' + num(x.collected) + '명</div>' + (r.seq ? '<div class="s">' + r.seq + '번째 전략 실행 중</div>' : '') + '</div></div>' +
    '<div class="bar run"><i style="width:' + Math.max(pct, 3) + '%"></i></div>' +
    '<div class="s"><span class="spin"></span>' + (p.paused ? '⏸ 잠시 멈춤(' + esc(p.paused) + ')' : (p.collect === false ? '서칭' : '수집') + ' 중') + ' · 라운드 ' + num(cur) + ' / ' + num(r.total) + ' · 남은 ' + num(r.left) + '</div>' +
    (p.combo ? '<div class="s">지금 검색: ' + esc(p.combo) + '</div>' : '') +
    (p.log ? '<div class="mono">' + esc(p.log) + '</div>' : '') +
    (p.beat ? '<div class="s" style="margin-top:6px">' + (stale ? '⚠️ PC 진행 신호가 늦어지고 있습니다 · ' : 'PC 진행 신호 ') + '<span data-sago="' + p.beat + '">' + secAgo(p.beat) + '</span> · 숫자는 2분마다 갱신</div>' : '') +
    '</div>';
}
function loginView() {
  $('main').innerHTML = '<form class="login box" id="lf"><div class="t">확장 프로그램 동기화 계정으로 로그인</div>' +
    '<label>메일<input id="em" type="email" autocomplete="username" required></label>' +
    '<label>비밀번호<input id="pw" type="password" autocomplete="current-password" required></label>' +
    '<div class="err" id="le" role="alert"></div><button class="btn">로그인</button></form>';
  $('lf').onsubmit = async function(ev) {
    ev.preventDefault();
    try { saveSession(await auth('token?grant_type=password', { email: $('em').value.trim(), password: $('pw').value })); render(); load(); }
    catch (e) { $('le').textContent = e.message; }
  };
}
function homeView() {
  let h = '';
  if (loadError) h += '<div class="warn">' + esc(loadError) + '</div>';
  if (!state) { $('main').innerHTML = h + '<div class="box">PC 신호를 기다리고 있습니다. 확장 프로그램을 새로고침한 PC가 켜져 있으면 30초 안에 나타납니다.</div>' + foot(); return; }
  h += statusBox();
  if (!online()) h += '<div class="warn">PC가 꺼졌거나 크롬이 닫혔을 수 있습니다. 지금은 명령을 보낼 수 없습니다.</div>';
  if (state.bot) h += '<div class="warn">사람인 보안 확인 화면이 떴습니다. PC에서 직접 확인해 주세요.</div>';
  if (state.boardOut) h += '<div class="warn">하이웍스 로그인이 풀려 새 오더를 확인할 수 없습니다. PC에서 로그인해 주세요.</div>';
  const board = (state.board || []).filter(function(p) { return !skipped.has(p.post); });
  if (board.length) h += '<h2>게시판 새 오더 ' + board.length + '건</h2>' + board.map(function(p) {
    return '<div class="box"><div class="t">' + esc(p.title) + '</div><div class="s">' + esc(String(p.at).slice(0, 10)) + '</div><div class="two">' +
      btn('가져오기 + 수집', 'boardgo', p.post) + btn('가져오기만', 'boardget', p.post, 'sec') + '</div><button class="btn sec" data-skip="' + esc(p.post) + '">무시 (다시 표시하지 않음)</button></div>';
  }).join('');
  const live = [];
  evals().forEach(function(e) { live.push('<div class="box">' + evalBox(e, state.orders.find(function(o) { return o.id === e.orderId; }) || { title: '명단 평가' }) + '</div>'); });
  state.orders.forEach(function(o) {
    if (o.running) live.push('<div class="box">' + liveBox(o, srSite(o), true) + btn('수집 중지', 'stop', o.id, 'sec') + '</div>');
    if (o.jk && o.jk.running) live.push('<div class="box">' + liveBox(o, jkSite(o), true) + btn('잡코리아 수집 중지', 'jkstop', o.id, 'sec') + '</div>');
  });
  if (live.length) h += '<h2>진행 중</h2>' + live.join('');
  if (state.orders.some(function(o) { return o.ap; })) h += '<h2>자동운전</h2><div class="box"><div class="s">' + (state.apPaused ? '일시정지됨' : '돌아가는 중') + '</div>' +
    (state.apPaused ? btn('자동운전 재개', 'apresume', '') : btn('자동운전 일시정지', 'apstop', '', 'sec')) + '</div>';
  h += '<h2>오더 ' + state.orders.length + '건</h2><div class="list">' + (state.orders.map(function(o) {
    return '<button class="row" data-open="' + esc(o.id) + '"><div class="t">' + esc(o.title) + '</div><div class="s">' + esc(stateLine(o)) + (o.must ? ' · 필수 <b>' + o.must + '</b>' : '') + '</div></button>';
  }).join('') || '<div class="empty">열려 있는 오더가 없습니다.</div>') + '</div>' + foot();
  $('main').innerHTML = h;
}
function foot() { return '<button class="btn sec" id="out" style="margin-top:24px">로그아웃</button>'; }

// 오더 화면: 위에서 사람인·잡코리아를 고르고, 그 사이트의 1. 전략 → 2. 전체 수집 → 3. 명단 평가 (확장 전략 창처럼 사이트별)
let siteTab = '', mustTab = 'all';
function orderView(o) {
  const hours = Array.from({ length: 24 }, function(_, i) { return '<option value="' + i + '"' + (i === state.startHour ? ' selected' : '') + '>' + i + '시</option>'; }).join('');
  const jk = siteTab === 'jk';
  const x = jk ? jkSite(o) : srSite(o);
  const e = evalOfOrder(o.id, jk ? 'jk' : '');
  const pid = (jk ? 'jk:' : '') + o.id;
  let h = statusBox();
  if (!online()) h += '<div class="warn">PC 응답이 없어 명령을 보낼 수 없습니다.</div>';
  h += '<div class="tabs" role="tablist"><button data-site="" class="' + (jk ? '' : 'on') + '" role="tab" aria-selected="' + !jk + '">사람인</button><button data-site="jk" class="' + (jk ? 'on' : '') + '" role="tab" aria-selected="' + jk + '">잡코리아</button></div>';
  h += '<div class="box">';
  h += '<div class="step"><div class="t">1. 전략</div>';
  if (!o.analyzed) h += '<div class="s">PC에서 오더 분석을 먼저 해 주세요.</div>';
  else if (x && x.plan) { const r = roundsOf(x); h += '<div class="s">' + (r.seq ? r.seq + '번째 전략 · ' : '') + '라운드 ' + r.total + '개 · 남은 라운드 ' + r.left + '개</div>'; }
  else if (jk) h += '<div class="s">잡코리아 전략이 아직 없습니다. 만들고 바로 전체 수집을 시작합니다.</div>' + btn('잡코리아 전략 만들기 + 전체 수집', 'jkgo', o.id);
  else h += '<div class="s">키워드와 라운드를 자동으로 고릅니다.</div>' + btn('전략 만들기', 'plan', o.id);
  h += '</div><div class="step"><div class="t">2. 전체 수집</div>';
  if (x && x.running) h += liveBox(o, x, false) + btn(jk ? '잡코리아 수집 중지' : '수집 중지', jk ? 'jkstop' : 'stop', o.id, 'sec');
  else if (x) {
    const r = roundsOf(x);
    h += '<div class="cols"><div><div class="s">이 전략 수집</div><div class="t">' + (r.collected != null ? num(r.collected) + '명' : '—') + '</div><div class="s">라운드 ' + r.done + ' / ' + r.total + '</div></div>' +
      '<div><div class="s">이 오더 누적</div><div class="t">' + num(x.collected) + '명</div>' + (r.seq ? '<div class="s">' + r.seq + '번째 전략</div>' : '') + '</div></div>';
  } else h += '<div class="s">전략을 만들면 수집할 수 있습니다.</div>';
  if (x && !x.running && x.plan && roundsOf(x).left) {
    h += btn(x.collected ? '지금 이어서 수집' : '지금 전체 수집', jk ? 'jkcollect' : 'collect', o.id);
    if (!jk) {
      if (o.night === 'wait') h += '<div class="s" style="margin-top:10px">밤 수집 대기 중 (' + state.startHour + '시 시작)</div>' + btn('밤 수집 취소', 'nightoff', o.id, 'sec');
      else h += '<label>밤 수집 시작 시각<select id="hour">' + hours + '</select></label>' + btn('밤 수집 등록', 'nighton', o.id, 'sec');
    }
  }
  h += '</div><div class="step"><div class="t">3. 명단 평가</div>';
  const other = jk ? srSite(o) : jkSite(o);
  if (e && e.active) h += evalBox(e);
  else if (x && x.collected && !x.running && !x.ranked) h += '<div class="s">유사도 순위가 아직 없습니다.</div>' + btn('순위 계산', jk ? 'jkrank' : 'poolrank', o.id);
  else if (x && x.ranked && !x.running) {
    if (e) h += evalBox(e);
    h += '<label>필수 목표 인원<input id="goal" type="number" inputmode="numeric" min="1" max="500" value="' + (state.goal || 10) + '"></label>' + btn((e ? '새로 ' : '') + siteWord(x.site) + ' 명단 평가 시작', 'poolstart', pid) +
      '<div class="s" style="margin-top:6px">1차 점수 순으로 한 줄로 세워 위에서부터 20명씩 정밀 판정합니다. 연속으로 필수가 안 나오면 멈춥니다. API 비용이 들고, 자동 제안은 하지 않습니다.</div>' +
      (other && other.running ? '<div class="s">' + siteWord(other.site) + ' 수집과는 따로 돌아갑니다.</div>' : '');
  }
  else h += '<div class="s">수집이 끝나면 시작할 수 있습니다.</div>';
  h += '</div>';
  if (!jk) h += '<div class="step"><div class="t">자동운전</div>' + (o.ap ? '<div class="s">' + esc(o.ap) + '</div>' : (o.analyzed ? btn('자동운전 등록', 'apadd', o.id, 'sec') : '<div class="s">오더 분석 뒤 등록할 수 있습니다.</div>')) + '</div>';
  h += '</div>';
  // 필수 추천 후보: 전체(사람인+잡코리아 합산) · 사이트별
  const list = must[o.id];
  const isJk = function(c) { return /^JK\d+$/.test(String(c.residx)); };
  const cnt = list ? { all: list.length, sr: list.filter(function(c) { return !isJk(c); }).length, jk: list.filter(isJk).length } : null;
  h += '<h2>필수 추천 후보 ' + (cnt ? cnt.all + '명 (사람인 ' + cnt.sr + ' · 잡코리아 ' + cnt.jk + ')' : o.must + '명') + '</h2>';
  if (cnt) h += '<div class="tabs">' + [['all', '전체 ' + cnt.all], ['sr', '사람인 ' + cnt.sr], ['jk', '잡코리아 ' + cnt.jk]].map(function(t) { return '<button data-must="' + t[0] + '" class="' + (mustTab === t[0] ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') + '</div>';
  h += '<div class="box">';
  const shown = list ? list.filter(function(c) { return mustTab === 'all' || (mustTab === 'jk') === isJk(c); }) : list;
  if (list === undefined) h += '<div class="s">불러오는 중…</div>';
  else if (list === null) h += '<div class="s">불러오지 못했습니다.</div>';
  else if (!shown.length) h += '<div class="s">아직 없습니다.</div>';
  else h += shown.map(function(c) {
    const url = /^https:\/\//.test(c.url || '') ? c.url : '';
    return '<div class="c"><div class="t"><span class="tag">' + (isJk(c) ? '잡코리아' : '사람인') + '</span>' + esc(c.realName || c.name) + ' <span class="s">' + esc(c.genderAge) + ' · ' + esc(c.career) + '</span></div>' +
      '<div class="s">' + esc(c.detail.reason || c.reason) + '</div>' + (c.offered ? '<div class="s"><b>제안 완료</b></div>' : '') +
      (url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">이력서 열기</a>' : '') + '</div>';
  }).join('');
  $('main').innerHTML = h + '</div>';
}

function render() {
  const o = view && state ? state.orders.find(function(x) { return x.id === view; }) : null;
  if (view && !o) view = null;
  $('back').hidden = !o;
  $('title').textContent = o ? o.title : 'searchFlow';
  $('reload').hidden = !session;
  // 입력 중인 값은 다시 그려도 유지
  const keep = { goal: $('goal') && $('goal').value, hour: $('hour') && $('hour').value };
  if (!session) loginView(); else if (o) orderView(o); else homeView();
  if (keep.goal && $('goal')) $('goal').value = keep.goal;
  if (keep.hour && $('hour')) $('hour').value = keep.hour;
}

document.addEventListener('click', function(ev) {
  const b = ev.target.closest('button');
  if (!b) return;
  if (b.id === 'out') { saveSession(null); state = null; view = null; render(); return; }
  if (b.dataset.open) { view = b.dataset.open; siteTab = ''; mustTab = 'all'; scrollTo(0, 0); render(); loadMust(view); return; }
  if (b.dataset.site !== undefined) { siteTab = b.dataset.site; render(); return; }
  if (b.dataset.must) { mustTab = b.dataset.must; render(); return; }
  if (b.dataset.skip) {
    if (!confirm('이 오더를 무시할까요? 앱과 알림에 다시 나오지 않습니다.')) return;
    const post = b.dataset.skip;
    skipped.add(post); render();
    rest('sf_board_seen?on_conflict=user_id,post', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: [{ user_id: session.uid, post: post, skipped: true }] })
      .catch(function(e) { skipped.delete(post); render(); toast(e.message, true); });
    return;
  }
  const cmd = b.dataset.cmd;
  if (!cmd) return;
  const args = {};
  if (cmd === 'poolstart') {
    const g = parseInt($('goal').value, 10);
    if (!(g >= 1 && g <= 500)) { toast('필수 목표는 1~500명으로 적어 주세요', true); return; }
    if (!confirm((/^jk:/.test(b.dataset.id) ? '잡코리아' : '사람인') + ' 명단에서 필수 ' + g + '명을 목표로 명단 평가를 시작할까요?')) return;
    args.goal = g;
  }
  if (cmd === 'jkgo' && !confirm('잡코리아 전략을 만들고 바로 전체 수집을 시작할까요?')) return;
  if (cmd === 'nighton') args.startHour = parseInt($('hour').value, 10);
  send(cmd, b.dataset.id, args);
});
$('back').onclick = function() { view = null; scrollTo(0, 0); render(); };
$('reload').onclick = function() { load(); if (view) loadMust(view); };
document.addEventListener('visibilitychange', function() { if (!document.hidden) load(); });
// PC는 진행 중일 때 2분마다 올림 → 수집 중 20초, 아니면 30초마다 읽음. '○초 전'은 1초마다 갱신
let lastLoad = 0;
setInterval(function() {
  if (document.hidden || sending) return;
  const running = state && (state.orders || []).some(function(o) { return o.running || (o.jk && o.jk.running); });
  if (Date.now() - lastLoad >= (running ? 20000 : 30000)) { lastLoad = Date.now(); load(); }
  document.querySelectorAll('[data-sago]').forEach(function(el) { el.textContent = secAgo(+el.dataset.sago); });
  document.querySelectorAll('[data-ago]').forEach(function(el) { el.textContent = ago(+el.dataset.ago) + ' 확인'; });
}, 1000);
render(); load();
</script>
</body>
</html>
