<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>서류 검토 결과 회신 | 리니어스</title>
<style>
  :root { --navy: rgb(52,68,94); --ink: #333; --muted: #6b7280; --line: #e4e8ee; --bg: #eef1f5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.7 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .wrap { max-width: 560px; margin: 32px auto; padding: 0 16px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .head { background: var(--navy); color: #fff; padding: 18px 24px; font-weight: 700; font-size: 16px; }
  .body { padding: 22px 24px 24px; }
  .who { font-size: 18px; font-weight: 700; margin: 0; }
  .pos { color: var(--muted); margin: 2px 0 18px; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opt { border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 12px 10px; font: inherit; font-weight: 700; cursor: pointer; color: var(--ink); }
  .opt small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .opt[aria-pressed="true"] { border-color: var(--navy); background: #eef2f8; color: var(--navy); }
  .opt:focus-visible, button.send:focus-visible, textarea:focus-visible { outline: 2px solid rgb(61,86,124); outline-offset: 2px; }
  label { display: block; margin: 18px 0 6px; font-size: 13px; color: var(--muted); }
  textarea { width: 100%; min-height: 76px; border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: inherit; resize: vertical; }
  button.send { margin-top: 16px; width: 100%; padding: 13px; border: 0; border-radius: 10px; background: var(--navy); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  button.send:disabled { opacity: .5; cursor: default; }
  .msg { margin-top: 14px; font-size: 14px; }
  .msg.ok { color: #3f6553; font-weight: 700; }
  .msg.err { color: #9b4b4b; }
  .note { color: var(--muted); font-size: 13px; margin: 14px 0 0; }
  .item { border-top: 1px solid var(--line); padding: 16px 0 4px; }
  .item:first-of-type { border-top: 0; padding-top: 4px; }
  .item .pos { margin-bottom: 10px; }
  .item .opts { grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .item .opt { padding: 9px 4px; font-size: 14px; }
  .item input.memo { width: 100%; margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 14px; }
  .tag { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: #f6eceb; color: #9b4b4b; font-size: 12px; font-weight: 700; vertical-align: 2px; }
  .lead { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  @media (max-width: 420px) { .item .opts { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 420px) { .opts { grid-template-columns: 1fr; } .item .opts { grid-template-columns: 1fr 1fr; } .wrap { margin: 16px auto; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head">서류 검토 결과 회신</div>
    <div class="body" id="body">
      <p class="pos" id="loading">불러오는 중입니다.</p>
    </div>
  </div>
</div>
<script>
var API = 'https://qxcrtwtjhllsbgahfqvd.supabase.co/functions/v1/sf-pmreply';
var q = new URLSearchParams(location.search);
var k = q.get('k') || '', pick = q.get('a') || '';
var LABEL = { pass: '서류 통과', fail: '탈락', pending: '검토 중', hold: '보류' };
var SUB = { pass: '면접 진행', fail: '이번엔 함께하지 않음', pending: '아직 결과 없음', hold: '결정을 미룸' };
var KEYS = ['pass', 'fail', 'pending', 'hold'];
// 사전 검토 요청 (정식 추천 전 — 추천 진행 여부 의견)
function useReview() {
  LABEL = { go: '추천 가능', no: '추천 어려움', ask: '확인 필요' };
  SUB = { go: '정식 추천 진행해도 좋음', no: '이번 포지션엔 진행하지 않음', ask: '조건·궁금한 점 먼저 확인' };
  KEYS = ['go', 'no', 'ask'];
  document.title = '후보자 검토 의견 회신 | 리니어스';
  document.querySelector('.head').textContent = '후보자 검토 의견 회신';
}
var body = document.getElementById('body');
function esc(s) { return String(s || '').replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function stop(text) { body.innerHTML = '<p class="msg err">' + esc(text) + '</p>'; }
function done(d, a) {
  body.innerHTML = '<p class="who">' + esc(d.name) + '님</p><p class="pos">' + esc(d.position) + '</p>' +
    '<p class="msg ok">"' + LABEL[a] + '"(으)로 전달되었습니다. 감사합니다.</p>' +
    (a === 'pending' || a === 'hold' ? '<p class="note">결과가 나오면 같은 링크에서 다시 알려 주세요.</p>' : '') +
    (a === 'go' ? '<p class="note">후보자와 상세 통화를 진행한 뒤 정식 추천서를 드리겠습니다.</p>' : a === 'ask' ? '<p class="note">메모에 적어 주신 내용을 후보자에게 확인해 회신드리겠습니다. 의견이 바뀌면 같은 링크에서 다시 알려 주세요.</p>' : '');
}
function render(d) {
  if (d.kind === 'review' && KEYS[0] !== 'go') useReview();
  if (d.result) return body.innerHTML = '<p class="who">' + esc(d.name) + '님</p><p class="pos">' + esc(d.position) + '</p><p class="msg ok">이미 "' + LABEL[d.result] + '"(으)로 반영되어 있습니다. 감사합니다.</p>';
  if (d.closed) return stop('이 후보자는 진행이 종료되었습니다. 변경이 필요하면 메일로 회신해 주세요.');
  if (d.expired) return stop('회신 기간(30일)이 지난 링크입니다. 메일로 회신해 주세요.');
  if (!LABEL[pick]) pick = d.answer || '';
  body.innerHTML = '<p class="who">' + esc(d.name) + '님</p><p class="pos">' + esc(d.position) + '</p>' +
    '<div class="opts" role="group" aria-label="검토 결과">' + KEYS.map(function(a) {
      return '<button type="button" class="opt" data-a="' + a + '" aria-pressed="' + (a === pick) + '">' + LABEL[a] + '<small>' + SUB[a] + '</small></button>';
    }).join('') + '</div>' +
    '<label for="memo">' + (d.kind === 'review' ? '메모 (선택) — 조건 협의 가능 여부, 후보자에게 확인할 점 등' : '메모 (선택) — 사유, 면접 희망 일정, 결과 예상 시점 등') + '</label><textarea id="memo" maxlength="500">' + esc(d.memo) + '</textarea>' +
    '<button type="button" class="send" id="send"' + (pick ? '' : ' disabled') + '>회신 보내기</button><div class="msg" id="msg" role="status"></div>' +
    (d.answer ? '<p class="note">지난 회신: ' + LABEL[d.answer] + '</p>' : '');
  body.querySelectorAll('.opt').forEach(function(b) {
    b.onclick = function() {
      pick = b.dataset.a;
      body.querySelectorAll('.opt').forEach(function(x) { x.setAttribute('aria-pressed', String(x === b)); });
      document.getElementById('send').disabled = false;
    };
  });
  document.getElementById('send').onclick = function() {
    var btn = this, msg = document.getElementById('msg');
    btn.disabled = true; msg.className = 'msg'; msg.textContent = '보내는 중입니다.';
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ k: k, a: pick, memo: document.getElementById('memo').value }) })
      .then(function(r) { return r.json().then(function(j) { return { ok: r.ok, j: j }; }); })
      .then(function(x) {
        if (x.ok && x.j.ok) return done(x.j, pick);
        if (x.j && x.j.error === 'done') return render(x.j);
        msg.className = 'msg err'; msg.textContent = '전달하지 못했습니다. 잠시 뒤 다시 눌러 주세요.'; btn.disabled = false;
      })
      .catch(function() { msg.className = 'msg err'; msg.textContent = '전달하지 못했습니다. 잠시 뒤 다시 눌러 주세요.'; btn.disabled = false; });
  };
}
// 2026-11-24 문자 문의 묶음 (?b=): 문자 한 통에 담긴 후보자 전부를 한 화면에서 — 고른 후보자만 보냄 (고르지 않은 후보자는 그대로)
// 2026-11-25: 사전 검토·PM 검토 후보자(kind 'review')는 추천 가능·추천 어려움·확인 필요
var RV = { go: '추천 가능', no: '추천 어려움', ask: '확인 필요' };
function keysOf(x) { return x.kind === 'review' ? ['go', 'no', 'ask'] : ['pass', 'fail', 'pending', 'hold']; }
function labelOf(x, a) { return x.kind === 'review' ? RV[a] : LABEL[a]; }
function renderBatch(d) {
  var picks = {};
  var open = d.items.filter(function(x) { return !x.result && !x.closed; });
  if (d.expired) return stop('회신 기간(30일)이 지난 링크입니다. 메신저나 메일로 알려 주세요.');
  body.innerHTML = '<p class="lead">결과가 나온 후보자만 골라 보내 주세요. 메신저 등으로 이미 알려 주신 후보자는 그냥 두셔도 됩니다.</p>' +
    d.items.map(function(x, i) {
      var head = '<p class="who">' + esc(x.name) + '님' + (x.final && !x.result && !x.closed ? '<span class="tag">최종 문의</span>' : '') + '</p><p class="pos">' + esc(x.position) + '</p>';
      if (x.result) return '<div class="item">' + head + '<p class="msg ok">"' + labelOf(x, x.result) + '"(으)로 반영되어 있습니다.</p></div>';
      if (x.closed) return '<div class="item">' + head + '<p class="note">진행이 종료된 후보자입니다.</p></div>';
      return '<div class="item" data-i="' + i + '">' + head + '<div class="opts" role="group" aria-label="' + esc(x.name) + ' 검토 결과">' + keysOf(x).map(function(a) {
        return '<button type="button" class="opt" data-a="' + a + '" aria-pressed="false">' + labelOf(x, a) + '</button>';
      }).join('') + '</div><input class="memo" maxlength="500" placeholder="메모 (선택) — 사유, 면접 일정, 결과 예상 시점" aria-label="' + esc(x.name) + ' 메모" value="' + esc(x.memo) + '">' +
        (x.answer ? '<p class="note">지난 회신: ' + labelOf(x, x.answer) + '</p>' : '') + '</div>';
    }).join('') +
    (open.length ? '<button type="button" class="send" id="send" disabled>회신 보내기</button><div class="msg" id="msg" role="status"></div>' : '<p class="msg ok">모든 후보자의 결과가 반영되어 있습니다. 감사합니다.</p>');
  body.querySelectorAll('.item[data-i]').forEach(function(el) {
    var i = el.dataset.i;
    el.querySelectorAll('.opt').forEach(function(b) {
      b.onclick = function() {
        var on = picks[i] !== b.dataset.a;
        picks[i] = on ? b.dataset.a : '';
        el.querySelectorAll('.opt').forEach(function(x) { x.setAttribute('aria-pressed', String(on && x === b)); });
        document.getElementById('send').disabled = !Object.keys(picks).some(function(j) { return picks[j]; });
      };
    });
  });
  var send = document.getElementById('send');
  if (!send) return;
  send.onclick = function() {
    var msg = document.getElementById('msg'), todo = Object.keys(picks).filter(function(j) { return picks[j]; });
    send.disabled = true; msg.className = 'msg'; msg.textContent = '보내는 중입니다.';
    var fails = 0;
    todo.reduce(function(p, i) {
      return p.then(function() {
        var x = d.items[i], memo = body.querySelector('.item[data-i="' + i + '"] .memo').value;
        return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ k: x.k, a: picks[i], memo: memo }) })
          .then(function(r) { return r.json().then(function(j) { if (!(r.ok && j.ok) && j.error !== 'done') fails++; }); })
          .catch(function() { fails++; });
      });
    }, Promise.resolve()).then(function() {
      if (fails) { msg.className = 'msg err'; msg.textContent = fails + '명을 전달하지 못했습니다. 잠시 뒤 다시 눌러 주세요.'; send.disabled = false; return; }
      body.innerHTML = '<p class="msg ok">' + todo.length + '명의 회신이 전달되었습니다. 감사합니다.</p><p class="note">아직 결과가 없는 후보자는 나중에 같은 링크에서 알려 주셔도 됩니다.</p>';
    });
  };
}
var batch = q.get('b') || '';
if (batch) {
  fetch(API + '?b=' + encodeURIComponent(batch))
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(d) { d && d.items ? renderBatch(d) : stop('링크를 찾지 못했습니다. 문자의 링크를 다시 눌러 주세요.'); })
    .catch(function() { stop('불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.'); });
} else
fetch(API + '?k=' + encodeURIComponent(k))
  .then(function(r) { return r.ok ? r.json() : null; })
  .then(function(d) { d ? render(d) : stop('링크를 찾지 못했습니다. 메일의 버튼을 다시 눌러 주세요.'); })
  .catch(function() { stop('불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.'); });
</script>
</body>
</html>
<!-- 2026-11-25 PM 무응답 개편: 묶음 문자에 사전 검토·PM 검토 후보자(추천 가능·어려움·확인 필요) -->
