<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>채용 정보 확인 | 리니어스</title>
<style>
  :root { --navy: #34445e; --blue: #3d567c; --pick: #f1f4f8; --line: #e2e6ec; --text: #333; --sub: #6b7380; --bg: #f5f6f8; --ask: #fff9ec; --askline: #e6cf9f; --ok: #4f7363; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
  .head { background: var(--navy); color: #f0f3f7; border-radius: 12px 12px 0 0; padding: 18px 20px; }
  .head h1 { font-size: 18px; font-weight: 600; line-height: 1.4; margin: 0 0 4px; }
  .head p { margin: 0; font-size: 13.5px; opacity: .85; }
  .card { background: #fff; border-radius: 0 0 12px 12px; padding: 20px; box-shadow: 0 4px 14px rgba(30,40,55,.06); }
  .guide { background: var(--pick); border-radius: 10px; padding: 11px 14px; font-size: 13.5px; margin: 0 0 20px; }
  .guide b { background: var(--ask); border: 1px dashed var(--askline); border-radius: 4px; padding: 0 5px; font-weight: 600; }
  section { margin: 0 0 22px; }
  section h2 { font-size: 14px; color: var(--navy); margin: 0 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .line { margin: 0 0 4px; padding-left: 12px; position: relative; }
  .line::before { content: '·'; position: absolute; left: 2px; color: var(--sub); font-weight: 700; }
  .field { margin: 8px 0 14px; }
  .field label, .field .label { display: block; font-size: 14px; font-weight: 600; margin: 0 0 6px; }
  .field small { display: block; font-weight: 400; color: var(--sub); font-size: 12.5px; margin-top: 1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 6px; }
  .chip { padding: 8px 13px; border: 1.5px solid var(--line); border-radius: 20px; background: #fff; font: inherit; font-size: 14px; color: inherit; cursor: pointer; }
  .chip.on { border-color: var(--blue); background: var(--pick); font-weight: 600; }
  textarea { display: block; width: 100%; min-height: 44px; padding: 10px 12px; border: 1.5px dashed var(--askline); border-radius: 10px; background: var(--ask); font: inherit; color: inherit; resize: none; overflow: hidden; }
  textarea:focus { outline: none; border-style: solid; border-color: var(--blue); background: #fff; }
  textarea.filled { border-style: solid; border-color: var(--line); background: #fff; }
  textarea::placeholder { color: #a08a5c; }
  .chk { display: flex; gap: 8px; align-items: flex-start; margin: 0 0 6px; cursor: pointer; }
  .chk input { width: 17px; height: 17px; margin: 4px 0 0; flex-shrink: 0; accent-color: var(--blue); cursor: pointer; }
  .chk input:checked + span { text-decoration: line-through; color: #9aa2ae; }
  .added { display: flex; gap: 8px; align-items: flex-start; margin: 0 0 6px; padding: 5px 8px 5px 10px; background: var(--pick); border-radius: 8px; }
  .added span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .added button { flex-shrink: 0; width: 26px; height: 26px; padding: 0; border: 0; background: none; color: var(--sub); font-size: 16px; line-height: 1; cursor: pointer; }
  .addrow { display: flex; gap: 6px; }
  .addrow input { flex: 1; min-width: 0; height: 44px; padding: 0 12px; border: 1.5px dashed var(--askline); border-radius: 10px; background: var(--ask); font: inherit; color: inherit; }
  .addrow input:focus { outline: none; border-style: solid; border-color: var(--blue); background: #fff; }
  .addrow input::placeholder { color: #a08a5c; }
  .addrow button { flex-shrink: 0; width: 44px; height: 44px; border: 0; border-radius: 10px; background: var(--blue); color: #fff; font-size: 18px; cursor: pointer; }
  .bar { padding: 6px 0 4px; }
  .submit { width: 100%; padding: 15px; border: 0; border-radius: 10px; background: var(--blue); color: #fff; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
  .submit:disabled { background: #c3cad4; cursor: default; }
  .ghost { width: 100%; padding: 13px; margin: 0 0 8px; border: 1.5px solid var(--blue); border-radius: 10px; background: #fff; color: var(--blue); font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
  .ghost:disabled { border-color: #c3cad4; color: #c3cad4; cursor: default; }
  dialog { width: min(640px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); padding: 0; border: 0; border-radius: 12px; color: var(--text); box-shadow: 0 12px 40px rgba(30,40,55,.25); overflow: hidden; }
  dialog[open] { display: flex; flex-direction: column; }
  dialog::backdrop { background: rgba(30,40,55,.5); }
  .pv-head { background: var(--navy); color: #f0f3f7; padding: 14px 20px; flex-shrink: 0; }
  .pv-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .pv-notice { padding: 12px 20px; background: var(--pick); font-size: 14px; flex-shrink: 0; }
  .pv-notice b { display: block; color: var(--navy); }
  .pv-notice small { display: block; color: var(--sub); font-size: 12.5px; margin-top: 2px; }
  .pv-body { padding: 16px 20px; overflow-y: auto; flex: 1; min-height: 0; }
  .pv-title { font-size: 16px; font-weight: 700; color: var(--navy); margin: 0 0 14px; }
  .pv-body h3 { font-size: 14px; color: var(--navy); margin: 16px 0 6px; }
  .pv-body ul { margin: 0; padding-left: 18px; }
  .pv-body li { margin: 0 0 3px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .pv-empty { color: #a08a5c; background: var(--ask); border-radius: 4px; padding: 0 5px; font-size: 13px; }
  .pv-memo { margin: 18px 0 0; padding: 10px 12px; background: var(--pick); border-radius: 8px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .pv-memo b { display: block; font-size: 13px; color: var(--sub); font-weight: 600; }
  .pv-foot { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); flex-shrink: 0; }
  .pv-foot button { flex: 1; margin: 0; padding: 13px; font-size: 15px; }
  .note { font-size: 13px; color: var(--sub); margin: 8px 0 0; text-align: center; }
  .err { color: #8a5a44; font-size: 13px; text-align: center; margin: 8px 0 0; }
  .msg { text-align: center; padding: 26px 6px 8px; }
  .msg h2 { font-size: 18px; margin: 0 0 6px; color: var(--navy); border: 0; }
  .links { margin: 18px 0 0; }
  .links a { display: flex; justify-content: space-between; gap: 10px; padding: 12px 14px; margin: 0 0 8px; border: 1.5px solid var(--line); border-radius: 10px; color: inherit; text-decoration: none; font-weight: 600; font-size: 14px; }
  .links a span { flex-shrink: 0; font-weight: 400; color: var(--sub); font-size: 13px; }
  .links a span.ok { color: var(--ok); font-weight: 600; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1 id="title">채용 정보 확인</h1><p id="sub">잠시만 기다려 주세요…</p></div>
  <div class="card">
    <div id="loading" class="msg"><p>불러오는 중…</p></div>
    <form id="form" class="hidden" autocomplete="off">
      <div class="guide" id="guide"></div>
      <div id="body"></div>
      <div class="bar">
        <button class="ghost hidden" id="preview" type="button">미리보기</button>
        <button class="submit" id="save" type="submit">저장하기</button>
        <p class="note" id="left"></p>
        <p class="err hidden" id="err"></p>
      </div>
    </form>
    <div id="done" class="hidden">
      <div class="msg"><h2>저장되었습니다</h2><p id="doneText"></p></div>
      <div class="links" id="links"></div>
    </div>
  </div>
</div>
<dialog id="pv" aria-labelledby="pvTitle">
  <div class="pv-head"><h2 id="pvTitle"></h2></div>
  <div class="pv-notice" id="pvNotice"></div>
  <div class="pv-body" id="pvBody" tabindex="0"></div>
  <div class="pv-foot">
    <button class="ghost" id="pvBack" type="button"></button>
    <button class="submit hidden" id="pvOk" type="button">이대로 저장</button>
  </div>
</dialog>
<script>
var API = 'https://qxcrtwtjhllsbgahfqvd.supabase.co/functions/v1/sf-client';
var token = new URLSearchParams(location.search).get('t') || '';
var $ = function(id) { return document.getElementById(id); };
var fields = [];     // { spec, get() }
var dirty = false;
var form = null;     // 서버에서 받은 양식
var struck = {};     // 기존 내용 중 체크(가로줄)한 문장

function fail(text) {
  $('loading').querySelector('p').textContent = text;
  $('title').textContent = '채용 정보 확인';
  $('sub').textContent = '리니어스';
}
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function grow(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; t.classList.toggle('filled', !!t.value.trim()); }
function countLeft() {
  var n = fields.filter(function(f) { return !f.get() && !f.spec.nolabel; }).length;
  $('left').textContent = n ? '아직 비어 있는 칸 ' + n + '개 · 모르는 항목은 비워 두고 저장하셔도 됩니다' : '모든 칸을 입력하셨습니다';
}
function touch() { dirty = true; countLeft(); }

// 줄 단위 입력: Enter 또는 → 버튼으로 기존 내용 아래에 한 줄씩 추가
function listInput(f, init, hooks) {
  var items = init.slice();
  var list = el('div');
  function draw() {
    list.textContent = '';
    items.forEach(function(text, i) {
      var row = el('div', 'added');
      row.appendChild(el('span', '', text));
      var x = el('button', '', '×');
      x.type = 'button';
      x.setAttribute('aria-label', text + ' 삭제');
      x.addEventListener('click', function() { items.splice(i, 1); draw(); touch(); });
      row.appendChild(x);
      list.appendChild(row);
    });
  }
  var inp = el('input');
  inp.type = 'text';
  inp.id = 'f_' + f.f;
  inp.placeholder = (f.ph || (f.opts ? '직접 입력' : '클릭해서 입력')) + ' 후 Enter';
  inp.setAttribute('aria-label', f.label);
  function add() {
    var v = inp.value.trim();
    if (!v) return;
    items.push(v);
    inp.value = '';
    draw(); touch();
  }
  // 한글 조합 중 Enter: 조합이 끝난 뒤에 추가 (빈 값이면 add가 무시하므로 두 번 불려도 안전)
  var waiting = false;
  inp.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    if (e.isComposing || e.keyCode === 229) waiting = true; else add();
  });
  inp.addEventListener('compositionend', function() {
    if (waiting) { waiting = false; setTimeout(add, 0); }
  });
  inp.addEventListener('input', function() { if (hooks && hooks.typing && inp.value.trim()) hooks.typing(); touch(); });
  var go = el('button', '', '→');
  go.type = 'button';
  go.setAttribute('aria-label', '추가');
  go.addEventListener('click', function() { add(); inp.focus(); });
  var row = el('div', 'addrow');
  row.appendChild(inp);
  row.appendChild(go);
  draw();
  return {
    nodes: [list, row],
    clear: function() { items = []; inp.value = ''; draw(); },
    // 추가 버튼을 안 누르고 저장해도 입력한 글이 사라지지 않게 함께 저장
    values: function() { return items.concat(inp.value.trim() ? [inp.value.trim()] : []); }
  };
}

// 기존 내용: 체크하면 가로줄 (필요 없는 내용 표시)
function buildLine(text) {
  var lab = el('label', 'chk');
  var c = el('input');
  c.type = 'checkbox';
  c.checked = !!struck[text];
  c.addEventListener('change', function() {
    if (c.checked) struck[text] = true; else delete struck[text];
    dirty = true;
  });
  lab.appendChild(c);
  lab.appendChild(el('span', '', text));
  return lab;
}

// 입력칸: 고를 수 있는 항목(opts) + 직접 입력
function buildField(f, value) {
  var rows = form.kind === 'jd';   // JD는 모든 입력칸이 줄 단위 (설문은 한 칸에 답)
  var box = el('div', 'field');
  var id = 'f_' + f.f;
  if (!f.nolabel) {
    var lab = el(f.opts ? 'div' : 'label', 'label', f.label);
    if (!f.opts) lab.htmlFor = id;
    if (f.hint) lab.appendChild(el('small', '', f.hint));
    box.appendChild(lab);
  }
  var picked = [], custom = value || '';
  var chips = [];
  if (f.opts) {
    var parts = value ? (rows ? value.split('\n') : f.multi ? value.split(', ') : [value]) : [];
    picked = parts.filter(function(p) { return f.opts.indexOf(p) >= 0; });
    custom = parts.filter(function(p) { return f.opts.indexOf(p) < 0; }).join(', ');
    var row = el('div', 'chips');
    f.opts.forEach(function(o) {
      var b = el('button', 'chip' + (picked.indexOf(o) >= 0 ? ' on' : ''), o);
      b.type = 'button';
      b.setAttribute('aria-pressed', picked.indexOf(o) >= 0 ? 'true' : 'false');
      b.addEventListener('click', function() {
        var i = picked.indexOf(o);
        if (i >= 0) picked.splice(i, 1);
        else {
          if (!f.multi) { picked = []; if (entry) entry.clear(); else { ta.value = ''; grow(ta); } }
          picked.push(o);
        }
        chips.forEach(function(c) { var on = picked.indexOf(c.textContent) >= 0; c.classList.toggle('on', on); c.setAttribute('aria-pressed', on ? 'true' : 'false'); });
        touch();
      });
      chips.push(b);
      row.appendChild(b);
    });
    box.appendChild(row);
  }
  var entry = null, ta = null;
  if (rows) {
    var init = f.opts ? parts.filter(function(p) { return f.opts.indexOf(p) < 0; }) : (value ? value.split('\n').filter(function(x) { return x.trim(); }) : []);
    entry = listInput(f, init, { typing: function() {
      if (f.opts && !f.multi && picked.length) {
        picked = [];
        chips.forEach(function(c) { c.classList.remove('on'); c.setAttribute('aria-pressed', 'false'); });
      }
    } });
    entry.nodes.forEach(function(n) { box.appendChild(n); });
    fields.push({ spec: f, get: function() { return picked.concat(entry.values()).join('\n'); } });
    return box;
  }
  ta = el('textarea');
  ta.id = id;
  ta.rows = 1;
  ta.value = custom;
  ta.placeholder = f.opts ? '직접 입력' : (f.ph || '클릭해서 입력해 주세요');
  if (f.opts) ta.setAttribute('aria-label', f.label + ' 직접 입력');
  ta.addEventListener('input', function() {
    if (f.opts && !f.multi && ta.value.trim() && picked.length) {
      picked = [];
      chips.forEach(function(c) { c.classList.remove('on'); c.setAttribute('aria-pressed', 'false'); });
    }
    grow(ta); touch();
  });
  box.appendChild(ta);
  setTimeout(function() { grow(ta); }, 0);
  fields.push({ spec: f, get: function() { return picked.concat(ta.value.trim() ? [ta.value.trim()] : []).join(', '); } });
  return box;
}

function render(d) {
  form = d;
  var jd = d.kind === 'jd';
  $('preview').classList.toggle('hidden', !jd);
  $('title').textContent = jd ? d.position : d.client + ' 채용 설문';
  $('sub').textContent = jd ? d.client + ' · JD 확인' : '약 5분 · 리니어스 헤드헌터 강연호';
  document.title = (jd ? d.position : '채용 설문') + ' | 리니어스';
  var guide = $('guide');
  if (jd) {
    guide.appendChild(document.createTextNode('보내 주신 채용계획으로 초안을 작성했습니다. '));
    guide.appendChild(el('b', '', '노란 칸'));
    guide.appendChild(document.createTextNode('을 채워 주세요. 추가할 내용은 입력 후 Enter 또는 → 버튼을 누르면 아래에 더해집니다. 이미 적힌 내용 중 필요 없는 것은 체크해 주세요. 공통 항목은 한 번 저장하면 다른 포지션에도 자동으로 채워집니다.'));
    String((d.answers || {})._struck || '').split('\n').forEach(function(x) { if (x) struck[x] = true; });
  } else guide.textContent = (d.spec.intro || '후보자에게 정확히 안내드리기 위한 질문입니다. 고르거나 짧게 적어 주시면 되고, 모르는 항목은 비워 두셔도 됩니다.');
  d.spec.sections.forEach(function(s) {
    var sec = el('section');
    sec.appendChild(el('h2', '', s.title));
    (s.items || []).forEach(function(i) {
      if (i.f) sec.appendChild(buildField(i, (d.answers || {})[i.f] || ''));
      else sec.appendChild(jd ? buildLine(i.t) : el('p', 'line', i.t));
    });
    $('body').appendChild(sec);
  });
  countLeft();
  $('loading').classList.add('hidden');
  $('form').classList.remove('hidden');
}

// 지금 입력한 값 (저장·미리보기 공통)
function collect() {
  var answers = {};
  fields.forEach(function(f) { var v = f.get(); if (v) answers[f.spec.f] = v; });
  var cut = Object.keys(struck);
  if (cut.length) answers._struck = cut.join('\n');
  return answers;
}

// 완성될 JD: 체크한 문장은 빼고, 추가한 줄은 항목 아래에 (팝업의 오더 복사와 같은 순서)
function jdView(answers) {
  var box = document.createDocumentFragment();
  var head = [form.client, form.position];
  if (answers.headcount) head.push(answers.headcount.replace(/\n/g, ' '));
  box.appendChild(el('p', 'pv-title', head.join('_')));
  form.spec.sections.forEach(function(s) {
    if (!s.h) return;
    var ul = el('ul');
    (s.items || []).forEach(function(i) {
      if (i.f === 'headcount') return;
      if (!i.f) { if (!struck[i.t]) ul.appendChild(el('li', '', i.t)); return; }
      var v = answers[i.f];
      if (v) v.split('\n').forEach(function(x) { ul.appendChild(el('li', '', x)); });
      else if (!i.nolabel) { var li = el('li'); li.appendChild(el('span', 'pv-empty', '미입력 · ' + i.label)); ul.appendChild(li); }
    });
    if (!ul.children.length) { var none = el('li'); none.appendChild(el('span', 'pv-empty', '내용 없음')); ul.appendChild(none); }
    box.appendChild(el('h3', '', s.h));
    box.appendChild(ul);
  });
  if (answers.memo) {
    var m = el('div', 'pv-memo');
    m.appendChild(el('b', '', '수정 의견'));
    m.appendChild(document.createTextNode(answers.memo));
    box.appendChild(m);
  }
  return box;
}

function openPv(confirming) {
  var answers = collect();
  var empty = fields.filter(function(f) { return !f.get() && !f.spec.nolabel; }).length;
  var cut = Object.keys(struck).length;
  $('pvTitle').textContent = confirming ? '저장 전 최종 확인' : 'JD 미리보기';
  var notice = $('pvNotice');
  notice.textContent = '';
  notice.appendChild(el('b', '', confirming ? '아래 내용으로 저장되어 담당 헤드헌터에게 전달됩니다.' : '현재 입력한 내용으로 저장하면 아래와 같이 작성됩니다.'));
  var sub = [];
  if (!confirming) sub.push('아직 저장되지 않았습니다');
  if (cut) sub.push('체크한 내용 ' + cut + '건 제외');
  if (empty) sub.push('미입력 ' + empty + '칸');
  if (sub.length) notice.appendChild(el('small', '', sub.join(' · ')));
  var body = $('pvBody');
  body.textContent = '';
  body.appendChild(jdView(answers));
  body.scrollTop = 0;
  $('pvBack').textContent = confirming ? '수정하기' : '닫기';
  $('pvOk').classList.toggle('hidden', !confirming);
  $('pv').showModal();
  $(confirming ? 'pvOk' : 'pvBack').focus();
}

function showLinks(links) {
  var box = $('links');
  box.textContent = '';
  var rest = (links || []).filter(function(l) { return l.t !== token; });
  rest.sort(function(a, b) { return a.saved - b.saved; });
  rest.forEach(function(l) {
    var a = el('a', '', l.kind === 'jd' ? l.position : '채용 설문');
    a.href = '?t=' + encodeURIComponent(l.t);
    a.appendChild(el('span', l.saved ? 'ok' : '', l.saved ? '✓ 저장됨' : '작성하기'));
    box.appendChild(a);
  });
  var left = rest.filter(function(l) { return !l.saved; }).length;
  $('doneText').textContent = left ? '남은 항목 ' + left + '건도 이어서 작성하실 수 있습니다.' : '모두 저장되었습니다. 감사합니다. 확인 후 연락드리겠습니다.';
}

function save(btn) {
  var answers = collect();
  var label = btn.textContent;
  btn.disabled = true; btn.textContent = '저장 중…';
  $('pvBack').disabled = true;
  $('err').classList.add('hidden');
  fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: token, answers: answers }) })
    .then(function(r) { return r.json().then(function(j) { if (!r.ok) throw new Error(j.error || 'server'); return j; }); })
    .then(function(j) {
      dirty = false;
      if ($('pv').open) $('pv').close();
      showLinks(j.links);
      $('form').classList.add('hidden');
      $('done').classList.remove('hidden');
      window.scrollTo(0, 0);
    })
    .catch(function(x) {
      btn.disabled = false; btn.textContent = label;
      $('pvBack').disabled = false;
      if ($('pv').open) $('pv').close();
      $('err').textContent = x.message === 'closed' ? '이 링크는 마감되었습니다.' : '저장하지 못했습니다. 잠시 뒤 다시 눌러 주세요.';
      $('err').classList.remove('hidden');
    });
}

$('form').addEventListener('submit', function(e) {
  e.preventDefault();
  if (form.kind === 'jd') openPv(true); else save($('save'));
});
$('preview').addEventListener('click', function() { openPv(false); });
$('pvBack').addEventListener('click', function() { $('pv').close(); });
$('pvOk').addEventListener('click', function() { save($('pvOk')); });
window.addEventListener('beforeunload', function(e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

if (!/^[0-9a-f-]{36}$/i.test(token)) fail('링크가 올바르지 않습니다. 메일의 링크를 다시 눌러 주세요.');
else fetch(API + '?t=' + encodeURIComponent(token))
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.closed) return fail('이 링크는 마감되었습니다. 감사합니다.');
    if (d.error) return fail('링크를 찾을 수 없습니다. 메일의 링크를 다시 눌러 주세요.');
    render(d);
  })
  .catch(function() { fail('불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.'); });
</script>
</body>
